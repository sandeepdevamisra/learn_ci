name: Run Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
      
      - name: Create build artifact
        run: |
          mkdir -p build
          echo "CI build successful" > build/status.txt
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-build 
          path: build/

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linting
        run: ruff check . 


